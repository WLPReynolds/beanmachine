<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0b3d">
<title>Bean Machine</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bean Machine">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg1:#1a0b3d;--bg2:#3b0f5c;--gold:#f7c948;--gold2:#ffe48a;--ink:#f4efff;--muted:#b9a9d9;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--good:#3ddc97;--warn:#ffb648;--bad:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom));
background:radial-gradient(900px 500px at 15% -10%,#7a22b8 0,transparent 60%),radial-gradient(800px 500px at 110% 5%,#0f63b0 0,transparent 55%),radial-gradient(700px 600px at 50% 120%,#b0127a 0,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
header{position:relative;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;overflow:hidden}
h1{margin:0;font-size:clamp(22px,7.6vw,30px);font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold2),var(--gold),#ff9ad5,var(--gold2));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,230,140,.8);animation:twinkle 2.4s ease-in-out infinite;opacity:0}
@keyframes twinkle{50%{opacity:1;transform:scale(1.3)}}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;font-size:15px;padding:9px 6px;border-radius:999px}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2300;box-shadow:0 2px 12px rgba(247,201,72,.45)}
.badge{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.badge.warn{background:rgba(255,190,80,.16);border-color:rgba(255,190,80,.5);color:#ffe2ad}
.badge.demo{background:rgba(255,93,115,.18);border-color:rgba(255,93,115,.5);color:#ffd0d7}
main{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;backdrop-filter:blur(6px)}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:14px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.balls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.plus{color:var(--muted);font-weight:800;margin:0 2px}
/* Balls */
.ball{--c:#2f86ff;--d:#0b3f8f;width:var(--s,44px);height:var(--s,44px);border-radius:50%;display:inline-grid;place-items:center;flex:none;border:0;padding:0;
background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,0) 24%),radial-gradient(circle at 50% 50%,var(--c) 0 52%,var(--d) 100%);
box-shadow:0 4px 10px rgba(0,0,0,.45),inset -3px -5px 8px rgba(0,0,0,.25)}
.ball b{width:62%;height:62%;border-radius:50%;background:#fff;color:#1b1030;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s,44px)*.34);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.c0{--c:#f3f3f8;--d:#8d8da8}.c1{--c:#2f86ff;--d:#0b3f8f}.c2{--c:#ff5fa8;--d:#a3185c}.c3{--c:#33cc66;--d:#137537}.c4{--c:#ffd431;--d:#b07d00}.c5{--c:#a066ff;--d:#4b1f9e}.em{--c:#3d6dff;--d:#152f8f}
.sm{--s:31px}.lg{--s:52px}
.starw{display:inline-block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));flex:none}
.star{width:calc(var(--s,44px)*1.1);height:calc(var(--s,44px)*1.1);display:grid;place-items:center;border:0;padding:0;background:linear-gradient(150deg,#fff6b8,#f7c948 45%,#c98b00);
clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star b{color:#4a2a00;font-weight:900;font-size:calc(var(--s,44px)*.33);margin-top:12%}
.starw.sm,.star.sm{--s:30px}
/* No-wrap rows that shrink the balls to fit the screen */
.balls.nw{flex-wrap:nowrap;gap:5px}.balls.nw .plus{margin:0}
.fit-lg{--s:min(50px,calc((100vw - 120px)/7.3))}
.fit-md{--s:min(36px,calc((100vw - 120px)/7.3))}
.fit{--s:max(20px,min(34px,calc((100vw - 185px)/7.3)))}
.rr{display:flex;align-items:center;gap:8px;margin:6px 0}
.rr .lbl{width:58px;flex:none;font-size:13px;color:var(--muted);font-weight:600}
.grp{padding:8px 0 6px;border-bottom:1px solid var(--line)}.grp:last-child{border-bottom:0}
.grp .dt{font-weight:700;font-size:14px;margin-bottom:2px}
.simview{position:relative;margin-top:12px;min-height:112px;padding:12px 8px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#24124f 0%,#0b0620 75%);border:1px solid var(--line)}.simview canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#simballs{position:relative}
.simhit{box-shadow:0 0 0 3px var(--gold2),0 0 14px var(--gold2);border-radius:50%}
.hit{opacity:.35;filter:grayscale(.85)}.ball.hit b{text-decoration:line-through}
.ball.new{box-shadow:0 0 0 3px var(--gold2),0 0 14px 4px rgba(247,201,72,.7)}
.starw.new{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px var(--gold))}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ibtn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.cw{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.cw-hi{background:rgba(255,93,115,.2);color:#ff8fa0}.cw-lo{background:rgba(61,220,151,.18);color:var(--good)}.cw-av{background:rgba(255,255,255,.1);color:var(--muted)}
.grp .dt{display:flex;justify-content:space-between;align-items:center;gap:8px}.grp .dt .cws{display:flex;gap:4px}
.crowdline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px;font-size:13px;color:var(--muted)}
.dv .b{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.dv .t{height:12px;border-radius:6px;background:rgba(255,255,255,.08);position:relative}
.dv .t:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.5)}
.dv .t i{position:absolute;top:0;bottom:0;border-radius:6px}
.rank{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.rank .when{font-size:12px;color:var(--muted);min-width:64px}
.grp,.latest{cursor:pointer;-webkit-user-select:none;user-select:none}
.latest .chev{color:var(--muted);font-size:14px;transition:transform .2s;display:inline-block;margin-left:6px}.latest.open .chev{transform:rotate(90deg)}
.grp{cursor:pointer;-webkit-user-select:none;user-select:none}
.grp .chev{color:var(--muted);font-size:12px;transition:transform .2s;display:inline-block;margin-left:6px}
.grp.open .chev{transform:rotate(90deg)}
.pb{margin:8px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.22)}
.pb h4{margin:0 0 6px;font-size:13px;color:var(--gold2)}
.pb table{font-size:13px}.pb td,.pb th{padding:4px 4px}.pb td:first-child,.pb th:first-child{text-align:left}.pb td:last-child,.pb th:last-child{text-align:right}
.pb .meta{font-size:11px;color:var(--muted);margin-top:6px}
.lockbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:rgba(247,201,72,.18);color:var(--gold2);font-size:12px;font-weight:800}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.chk:last-child{border-bottom:0}
.chk .box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#3a2300}
.chk.on .box{background:var(--gold);border-color:var(--gold)}
.ent{padding:8px 0;border-bottom:1px solid var(--line)}.ent:last-child{border-bottom:0}
.ent .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:700;font-size:14px}
.won{color:var(--gold2);font-weight:800}
.banner{position:relative;overflow:hidden;border-radius:18px;padding:16px;margin:12px 0;border:1px solid rgba(247,201,72,.6);background:linear-gradient(135deg,rgba(247,201,72,.35),rgba(255,95,168,.3),rgba(160,102,255,.3))}
.banner h2{margin:0 0 6px;font-size:22px}.banner .x{position:absolute;top:8px;right:10px;border:0;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;width:30px;height:30px;font-weight:900}
.banner.quiet{border-color:var(--line);background:var(--card);padding:12px 44px 12px 16px;font-size:14px}
.conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.8s linear infinite;opacity:.9;pointer-events:none}
@keyframes fall{to{transform:translateY(240px) rotate(540deg);opacity:0}}
.arrow{color:var(--gold2);font-weight:800;font-size:13px;margin:10px 0 6px}
.bonus{outline:2px dashed var(--gold);outline-offset:2px}
.drop{animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-60px) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}
/* Picker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;justify-items:center}
.grid .ball,.grid .starw{--s:38px;transition:transform .15s,opacity .15s,filter .15s}
.grid .off{opacity:.3;filter:grayscale(.85)}
.grid .ball:active{transform:scale(.9)}
/* Buttons & inputs */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;color:#3a2300;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 4px 16px rgba(247,201,72,.35)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.block{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.chip.on{background:rgba(247,201,72,.2);border-color:var(--gold);color:var(--gold2)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=url],input[type=number]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font-size:15px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span:before{transform:translateX(20px)}
/* Meter & tables */
.meter{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));position:relative;margin:10px 0 6px}
.meter i{position:absolute;top:-5px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #3a2300;transform:translateX(-50%)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800}
.p-low{background:rgba(61,220,151,.2);color:var(--good)}.p-med{background:rgba(255,182,72,.2);color:var(--warn)}.p-high{background:rgba(255,93,115,.2);color:var(--bad)}
ul.r{margin:8px 0 0;padding-left:18px;font-size:14px}ul.r li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12px}
td.prize{color:var(--gold2);font-weight:800}
.big{font-size:26px;font-weight:900}
.jack{background:linear-gradient(135deg,rgba(247,201,72,.25),rgba(255,95,168,.2));border-color:rgba(247,201,72,.5)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:10px 6px;justify-items:center}
.fcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.fbar{width:34px;height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff5fa8)}
.bars .b{display:grid;grid-template-columns:62px 1fr 48px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bars .t{height:14px;border-radius:6px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bars .t i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff5fa8,var(--gold));border-radius:6px}
.bars .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .d{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.hist .d:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(20,6,45,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 10px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;filter:grayscale(.6);opacity:.7}
nav button.on{color:var(--gold2)}nav button.on span{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#2a1040;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.card.install{background:linear-gradient(150deg,rgba(255,228,138,.22),rgba(255,95,168,.18));border-color:rgba(247,201,72,.45)}
.card.install .row{gap:8px}
dialog.sheet{border:1px solid var(--line);border-radius:20px;padding:20px;max-width:min(420px,calc(100vw - 32px));background:#2a1250;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog.sheet::backdrop{background:rgba(10,4,25,.6)}
dialog.sheet h2{margin:0 0 14px;font-size:20px}
.install-steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:12px}
.install-steps li{display:flex;gap:12px;align-items:flex-start;line-height:1.5;font-size:15px}
.install-steps .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2300;font-weight:900}
.share-icon{vertical-align:-3px;color:var(--gold)}
.tie{margin-left:6px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.06);color:var(--gold);font:inherit;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:none;cursor:pointer}
.tied{margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}
.card h3.dayh{color:var(--gold);font-size:15px;margin-top:18px}
.hstory{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--muted);font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px}
.hstory.on{color:var(--gold2);border-color:rgba(247,201,72,.6)}
.story p{line-height:1.5;margin:8px 0}.story .cap{text-align:center;margin:6px 0 0}
.bm{display:block;width:100%;max-width:420px;margin:0 auto}
.bm-peg{fill:var(--gold2);opacity:.85}
.bm-wall{stroke:rgba(255,255,255,.28);stroke-width:1.5;stroke-linecap:round}
.bm-hopper{fill:rgba(255,255,255,.06);stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.bm-curve{fill:none;stroke:var(--gold);stroke-width:1.2;stroke-dasharray:3 4;opacity:.55}
#bm-settled{transition:opacity 1.2s}
.bm-wobble{transform-box:fill-box;transform-origin:50% 90%;animation:bmwob 3.2s ease-in-out infinite}
@keyframes bmwob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.bm-wobble{animation:none}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script src="src/app.js?v=1.2.12"></script>
</body>
</html>
